[project]
name = "oursport-ai-backend"
version = "0.1.0"
description = "FastAPI backend for the OurSport AI live-sport app (mock data + live simulation)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=2.16",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
