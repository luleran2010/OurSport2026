[project]
name = "oursport"
version = "0.1.0"
description = "OurSport backend: automatic tournament setup, live scoring and personal coverage for local sport"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.3.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "gunicorn>=26.2.0",
    "openpyxl>=3.1.5",
    "procrastinate[psycopg]>=3.10.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pydantic[email]>=2.14.1",
    "pyjwt>=2.15.1",
    "pypdf>=6.21.2",
    "python-multipart>=0.0.32",
    "pywebpush>=2.5.0",
    "redis>=8.1.0",
    "segno>=1.6",
    "sqlalchemy[asyncio]>=2.1.6",
    "structlog>=26.1.0",
    "uvicorn-worker>=0.4.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "hypothesis>=6.170.8",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
    "types-openpyxl>=3.1.5.20261017",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "engine"]

[tool.pytest.ini_options]
testpaths = ["engine/tests", "app", "tests"]
addopts = "--import-mode=importlib -ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
# Docs hold illustrative snippets aligned for reading, not code to format.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated CHECK constraints are long SQL strings.
"alembic/versions/*" = ["E501"]
# Scores in notification texts use a typographic dash ("2–1").
"app/modules/audience/notifications.py" = ["RUF001"]
# The claim checker and its tests read Bengali digits and Finnish/Bengali words on purpose.
"app/modules/content/*" = ["RUF001", "RUF002", "RUF003"]
"tests/content/*" = ["RUF001", "RUF002", "RUF003"]
"tests/test_commentary.py" = ["RUF001"]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise make ruff treat the package as ours.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
files = ["engine", "app", "tests", "alembic"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

# The engine and shared core are held to strict typing (docs/02-architecture.md).
[[tool.mypy.overrides]]
module = ["engine", "engine.*", "app.core", "app.core.*"]
strict = true

[[tool.mypy.overrides]]
module = ["asyncpg", "pywebpush"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# Module boundaries (CLAUDE.md golden rules 3 and 7, docs/02-architecture.md "May call").
[tool.importlinter]
root_packages = ["app", "engine"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Engine is a pure library: no app code"
type = "forbidden"
source_modules = ["engine"]
forbidden_modules = ["app"]

[[tool.importlinter.contracts]]
name = "Engine is a pure library: no web, database, cache or logging frameworks"
type = "forbidden"
source_modules = ["engine"]
forbidden_modules = ["fastapi", "starlette", "sqlalchemy", "asyncpg", "redis", "alembic", "structlog", "pydantic_settings"]

[[tool.importlinter.contracts]]
name = "Core infrastructure does not depend on domain modules"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.modules", "app.main"]

[[tool.importlinter.contracts]]
name = "Modules talk to each other only through service and schemas"
type = "independence"
modules = ["app.modules.accounts", "app.modules.competitions", "app.modules.subscriptions", "app.modules.integrations", "app.modules.rules", "app.modules.setup", "app.modules.scoring", "app.modules.analysis", "app.modules.content", "app.modules.editorial", "app.modules.audience", "app.modules.media"]
ignore_imports = [
    "app.modules.** -> app.modules.*.service",
    "app.modules.** -> app.modules.*.schemas",
]
# These are standing rules, not exceptions for specific imports, so it is fine (and expected
# while modules are still empty) that they match nothing.
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Only analysis, rules, setup (and scoring, below) use the engine"
type = "forbidden"
source_modules = ["app.modules.accounts", "app.modules.competitions", "app.modules.subscriptions", "app.modules.integrations", "app.modules.content", "app.modules.editorial", "app.modules.audience", "app.modules.media"]
forbidden_modules = ["engine"]
# Direct use only: going through analysis' service (which runs the engine) is the point.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Scoring uses only engine.sports"
type = "forbidden"
source_modules = ["app.modules.scoring"]
forbidden_modules = ["engine.bracket", "engine.draw", "engine.format_auto", "engine.relevance", "engine.rng", "engine.scenarios", "engine.schedule", "engine.standings", "engine.tiebreakers"]
# Direct imports only: rules (which scoring may call) uses more of the engine itself.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "accounts may call only: no other module"
type = "forbidden"
source_modules = ["app.modules.accounts"]
forbidden_modules = ["app.modules.competitions", "app.modules.subscriptions", "app.modules.integrations", "app.modules.rules", "app.modules.setup", "app.modules.scoring", "app.modules.analysis", "app.modules.content", "app.modules.editorial", "app.modules.audience", "app.modules.media"]
# Direct calls only: going through an allowed module's service is fine.
allow_indirect_imports = true

